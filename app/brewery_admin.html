<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒蔵管理者専用ポータル - 日本酒DB</title>
    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #141d2f;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #d4af37;
            --accent-hover: #f3e5ab;
            --border-color: #1f293d;
            --glass-bg: rgba(20, 29, 47, 0.75);
            --glass-border: rgba(255, 255, 255, 0.05);
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            min-height: 100vh;
            padding-bottom: 3rem;
            background-image: radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(20, 29, 47, 0.8) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .header-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.05rem;
            font-weight: 600;
            padding: 0.75rem 1.25rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: rgba(212, 175, 55, 0.15);
            color: var(--accent);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            background: #0b0f19;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent), #aa820a);
            color: #000;
            border: none;
            padding: 0.85rem 2rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        .btn-submit:hover { transform: translateY(-2px); }

        .btn-add {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; }
        td { font-size: 0.95rem; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Card -->
    <div class="header-card">
        <div>
            <h1 id="breweryTitle" style="font-size: 1.8rem; color: var(--accent); margin-bottom: 0.4rem;">
                🍶 酒蔵管理者専用ポータル
            </h1>
            <p id="brewerySub" style="color: var(--text-muted); font-size: 0.95rem;">
                自社の基本情報および自社銘柄の編集・追加・削除を行えます。
            </p>
        </div>
        <div>
            <a href="/" style="color: var(--accent); text-decoration: none; font-size: 0.9rem; margin-right: 1rem;">← Viewerに戻る</a>
            <a href="/admin.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">全管理画面</a>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('infoTab', this)">🏛️ 1. 酒蔵基本情報の編集</button>
        <button class="tab-btn" onclick="switchTab('productsTab', this)">🍶 2. 自社銘柄の管理・追加</button>
    </div>

    <!-- Tab 1: 酒蔵基本情報 -->
    <div id="infoTab" class="tab-content active">
        <div class="form-card">
            <h3 style="margin-bottom: 1.5rem; color: #fff;">🏛️ 酒蔵プロフィールの編集</h3>
            <form onsubmit="saveBreweryInfo(event)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>酒蔵名 (法人名)</label>
                        <input type="text" id="bName" class="form-control" required readonly style="background: #1a2336;">
                    </div>
                    <div class="form-group">
                        <label>屋号・蔵名 (任意)</label>
                        <input type="text" id="bKuraName" class="form-control" placeholder="例: 旭酒造 蔵元">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1rem;">
                    <div class="form-group">
                        <label>都道府県</label>
                        <input type="text" id="bPrefecture" class="form-control" placeholder="例: 山口県">
                    </div>
                    <div class="form-group">
                        <label>所在地・住所</label>
                        <input type="text" id="bAddress" class="form-control" placeholder="例: 岩国市周東町獺越2167-1">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1rem;">
                    <div class="form-group">
                        <label>創業年 (西暦)</label>
                        <input type="number" id="bFounded" class="form-control" placeholder="例: 1948">
                    </div>
                    <div class="form-group">
                        <label>公式WebサイトURL</label>
                        <input type="url" id="bWebsite" class="form-control" placeholder="https://www.dassai.co.jp">
                    </div>
                </div>

                <div class="form-group">
                    <label>酒蔵の歴史・特徴・酒造りのこだわり</label>
                    <textarea id="bDesc" class="form-control" rows="4" placeholder="酒造りのこだわりや伝統、酒蔵の歴史をご記入ください..."></textarea>
                </div>

                <div id="infoMsg" style="margin-bottom: 1rem; color: var(--success); display: none;"></div>
                <button type="submit" class="btn-submit">💾 酒蔵情報を保存する</button>
            </form>
        </div>
    </div>

    <!-- Tab 2: 自社銘柄管理 -->
    <div id="productsTab" class="tab-content">
        <div class="form-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="color: #fff;">🍶 自社取り扱い銘柄一覧</h3>
                <button onclick="openProductModal()" class="btn-add">➕ 自社銘柄を新規追加</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ボトル画像</th>
                        <th>銘柄名 / 特定名称</th>
                        <th>アルコール</th>
                        <th>日本酒度 / 酸度</th>
                        <th>精米歩合 / 原料米</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="productTableBody">
                    <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">読み込み中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 銘柄追加・編集モーダル -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h3 id="pModalTitle" style="color: var(--accent);">➕ 自社銘柄の登録・編集</h3>
            <button onclick="closeProductModal()" style="background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer;">&times;</button>
        </div>
        <form onsubmit="saveProduct(event)">
            <input type="hidden" id="pId">
            
            <div class="form-group">
                <label>銘柄名 (必須)</label>
                <input type="text" id="pBrand" class="form-control" required placeholder="例: 獺祭">
            </div>

            <div class="form-group">
                <label>特定名称・商品名</label>
                <input type="text" id="pSpec" class="form-control" placeholder="例: 磨き二割三分 純米大吟醸">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem;">
                <div class="form-group">
                    <label>アルコール度 (%)</label>
                    <input type="number" step="0.1" id="pAlcohol" class="form-control" placeholder="15.0">
                </div>
                <div class="form-group">
                    <label>日本酒度 (SMV)</label>
                    <input type="text" id="pSmv" class="form-control" placeholder="+3.0">
                </div>
                <div class="form-group">
                    <label>酸度</label>
                    <input type="text" id="pAcidity" class="form-control" placeholder="1.4">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                <div class="form-group">
                    <label>精米歩合</label>
                    <input type="text" id="pPolish" class="form-control" placeholder="23%">
                </div>
                <div class="form-group">
                    <label>使用原料米</label>
                    <input type="text" id="pRice" class="form-control" placeholder="山田錦">
                </div>
            </div>

            <div class="form-group">
                <label>📷 ボトル画像のアップロード (または画像URL)</label>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <div id="pImgPreviewBox" style="width: 70px; height: 70px; border: 1px dashed var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #0b0f19; overflow: hidden; flex-shrink: 0;">
                        <span style="font-size: 0.75rem; color: var(--text-muted);">なし</span>
                    </div>
                    <div style="flex: 1;">
                        <input type="file" id="pImageFile" accept="image/*" onchange="handleProductImageUpload(event)" style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem;">
                        <input type="text" id="pImg" class="form-control" placeholder="画像URLまたはアップロード済みパス" oninput="updateImagePreviewFromUrl()">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit" style="width: 100%;">💾 銘柄情報を保存</button>
        </form>
    </div>
</div>

<script>
let currentBreweryName = '旭酒造';

function getSessionUser() {
    const saved = localStorage.getItem('sake_user_session');
    if (saved) {
        try { return JSON.parse(saved); } catch(e){}
    }
    return null;
}

function checkAccess() {
    const user = getSessionUser();
    if (!user) {
        alert('ログインが必要です。');
        window.location.href = '/';
        return;
    }
    
    if (user.role === 'brewery_admin') {
        currentBreweryName = user.assigned_brewery || '旭酒造';
    } else if (user.role === 'system_admin') {
        currentBreweryName = user.assigned_brewery || '旭酒造';
    } else {
        alert('酒蔵管理者権限が必要です。');
        window.location.href = '/';
        return;
    }

    document.getElementById('breweryTitle').innerText = `🍶 【${currentBreweryName}】専用管理ポータル`;
    document.getElementById('bName').value = currentBreweryName;

    loadBreweryInfo();
    loadBreweryProducts();
}

function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
}

async function loadBreweryInfo() {
    try {
        const res = await fetch(`/api/brewery?name=${encodeURIComponent(currentBreweryName)}`);
        if (res.ok) {
            const data = await res.json();
            if (data) {
                document.getElementById('bKuraName').value = data.kura_name || '';
                document.getElementById('bPrefecture').value = data.prefecture || '';
                document.getElementById('bAddress').value = data.address || '';
                document.getElementById('bFounded').value = data.founded_year || '';
                document.getElementById('bWebsite').value = data.website || '';
                document.getElementById('bDesc').value = data.description || '';
            }
        }
    } catch(e){}
}

async function saveBreweryInfo(e) {
    e.preventDefault();
    const msg = document.getElementById('infoMsg');
    msg.style.display = 'none';

    const payload = {
        brewery_name: currentBreweryName,
        kura_name: document.getElementById('bKuraName').value,
        prefecture: document.getElementById('bPrefecture').value,
        address: document.getElementById('bAddress').value,
        founded_year: document.getElementById('bFounded').value ? parseInt(document.getElementById('bFounded').value) : None,
        website: document.getElementById('bWebsite').value,
        description: document.getElementById('bDesc').value
    };

    try {
        const res = await fetch('/api/brewery_admin/info/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
            msg.innerText = '✅ 酒蔵の基本情報を正常に更新・保存しました！';
            msg.style.display = 'block';
        }
    } catch(e) {
        alert('保存エラーが発生しました');
    }
}

async function loadBreweryProducts() {
    const tbody = document.getElementById('productTableBody');
    try {
        const res = await fetch(`/api/brewery_admin/products?brewery=${encodeURIComponent(currentBreweryName)}`);
        const products = await res.json();

        if (!products || products.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">登録されている銘柄はありません</td></tr>';
            return;
        }

        tbody.innerHTML = products.map(p => `
            <tr>
                <td>${p.cropped_image_path_front || p.display_image ? `<img src="${p.cropped_image_path_front || p.display_image}" style="width: 50px; height: 50px; object-fit: contain; border-radius: 8px; background: #0b0f19;">` : '<div style="width: 50px; height: 50px; border-radius: 8px; background: #0b0f19; border: 1px dashed var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: var(--text-muted);">空白</div>'}</td>
                <td><strong>${p.brand_name}</strong><br><small style="color: var(--text-muted);">${p.spec_name || ''}</small></td>
                <td>${p.alcohol ? p.alcohol + '%' : '-'}</td>
                <td>${p.smv || '-'} / ${p.acidity || '-'}</td>
                <td>${p.polish_ratio || '-'} / ${p.rice_variety || '-'}</td>
                <td>
                    <button onclick='editProduct(${JSON.stringify(p)})' style="background: rgba(212,175,55,0.2); color: var(--accent); border: 1px solid rgba(212,175,55,0.4); padding: 0.35rem 0.75rem; border-radius: 6px; cursor: pointer; margin-right: 0.4rem;">✏️ 編集</button>
                    <button onclick="deleteProduct(${p.id}, '${p.brand_name}')" style="background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); padding: 0.35rem 0.75rem; border-radius: 6px; cursor: pointer;">🗑️ 削除</button>
                </td>
            </tr>
        `).join('');
    } catch(e) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #ef4444;">読み込みエラーが発生しました</td></tr>';
    }
}


function handleProductImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
        const base64 = evt.target.result;
        document.getElementById('pImg').value = base64;
        updateImagePreviewFromUrl();
    };
    reader.readAsDataURL(file);
}

function updateImagePreviewFromUrl() {
    const val = document.getElementById('pImg').value;
    const box = document.getElementById('pImgPreviewBox');
    if (val && val.trim() !== '') {
        box.innerHTML = `<img src="${val}" style="width: 100%; height: 100%; object-fit: contain;">`;
    } else {
        box.innerHTML = '<span style="font-size: 0.75rem; color: var(--text-muted);">空白</span>';
    }
}

function openProductModal(p = null) {
    document.getElementById('productModal').style.display = 'flex';
    if (p) {
        document.getElementById('pModalTitle').innerText = '✏️ 自社銘柄の編集';
        document.getElementById('pId').value = p.id;
        document.getElementById('pBrand').value = p.brand_name || '';
        document.getElementById('pSpec').value = p.spec_name || '';
        document.getElementById('pAlcohol').value = p.alcohol || '';
        document.getElementById('pSmv').value = p.smv || '';
        document.getElementById('pAcidity').value = p.acidity || '';
        document.getElementById('pPolish').value = p.polish_ratio || '';
        document.getElementById('pRice').value = p.rice_variety || '';
        document.getElementById('pImg').value = p.cropped_image_path_front || ''; updateImagePreviewFromUrl();
    } else {
        document.getElementById('pModalTitle').innerText = '➕ 自社銘柄の新規登録';
        document.getElementById('pId').value = '';
        document.getElementById('pBrand').value = '';
        document.getElementById('pSpec').value = '';
        document.getElementById('pAlcohol').value = '';
        document.getElementById('pSmv').value = '';
        document.getElementById('pAcidity').value = '';
        document.getElementById('pPolish').value = '';
        document.getElementById('pRice').value = '';
        document.getElementById('pImg').value = ''; updateImagePreviewFromUrl();
    }
}

function closeProductModal() {
    document.getElementById('productModal').style.display = 'none';
}

function editProduct(p) {
    openProductModal(p);
}

async function saveProduct(e) {
    e.preventDefault();
    const payload = {
        id: document.getElementById('pId').value ? parseInt(document.getElementById('pId').value) : null,
        brand_name: document.getElementById('pBrand').value,
        spec_name: document.getElementById('pSpec').value,
        brewery_name: currentBreweryName,
        alcohol: document.getElementById('pAlcohol').value ? parseFloat(document.getElementById('pAlcohol').value) : null,
        smv: document.getElementById('pSmv').value,
        acidity: document.getElementById('pAcidity').value,
        polish_ratio: document.getElementById('pPolish').value,
        rice_variety: document.getElementById('pRice').value,
        cropped_image_path_front: document.getElementById('pImg').value
    };

    try {
        const res = await fetch('/api/brewery_admin/product/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if (res.ok) {
            closeProductModal();
            loadBreweryProducts();
        }
    } catch(e){
        alert('保存に失敗しました');
    }
}

async function deleteProduct(id, name) {
    if (!confirm(`「${name}」を削除してもよろしいですか？`)) return;
    try {
        const res = await fetch('/api/brewery_admin/product/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id: id })
        });
        if (res.ok) {
            loadBreweryProducts();
        }
    } catch(e){
        alert('削除に失敗しました');
    }
}

document.addEventListener('DOMContentLoaded', checkAccess);
</script>

<script>
function checkBreweryAdminAccessPermission() {
    const saved = localStorage.getItem('sake_user_session');
    let u = null;
    if (saved) {
        try { u = JSON.parse(saved); } catch(e){}
    }
    if (!u) {
        alert('ログインが必要です');
        window.location.href = '/';
        return;
    }
    if (u.role === 'user') {
        alert('⚠️ 酒蔵管理者権限が必要です。');
        window.location.href = '/';
        return;
    }
    // system_admin または brewery_admin はOK
}
document.addEventListener('DOMContentLoaded', checkBreweryAdminAccessPermission);
</script>


<script>
function updateNavLinksForRole() {
    const saved = localStorage.getItem('sake_user_session');
    if (!saved) return;
    let u = null;
    try { u = JSON.parse(saved); } catch(e){}
    if (!u) return;

    const navContainer = document.getElementById('authNavButtons');
    if (!navContainer) return;

    let navHtml = '';
    if (u.role === 'system_admin') {
        navHtml = '<a href="/admin.html" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); padding: 0.35rem 0.8rem; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-right: 0.5rem;">👑 システム管理画面</a>';
        navHtml += '<a href="/brewery_admin.html" style="background: rgba(212, 175, 55, 0.2); color: #f3e5ab; border: 1px solid rgba(212, 175, 55, 0.4); padding: 0.35rem 0.8rem; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-right: 0.5rem;">🍶 酒蔵管理画面</a>';
