<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全国酒蔵マップ - JAPANESE SAKE DATABASE</title>
    
    <!-- Leaflet.js Maps CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 29, 47, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #d4af37;
            --accent-hover: #f3c638;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-nav {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        #map-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #0b0f19;
        }

        .region-filter-bar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            gap: 6px;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            padding: 8px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow-x: auto;
            max-width: 90vw;
        }

        .region-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .region-btn:hover, .region-btn.active {
            background: var(--accent);
            color: #0b0f19;
            font-weight: 700;
        }

        /* Leaflet Popup Styling */
        .leaflet-popup-content-wrapper {
            background: var(--card-bg) !important;
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 14px !important;
            color: var(--text-main) !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6) !important;
            padding: 0 !important;
        }

        .leaflet-popup-tip {
            background: var(--card-bg) !important;
        }

        .popup-card {
            padding: 1rem;
            width: 260px;
        }

        .popup-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 0.2rem;
        }

        .popup-pref {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
        }

        .popup-img {
            width: 100%;
            height: 120px;
            object-fit: contain;
            background: #0b0f19;
            border-radius: 8px;
            margin-bottom: 0.6rem;
        }

        .popup-info {
            font-size: 0.8rem;
            line-height: 1.4;
            margin-bottom: 0.6rem;
        }

        .popup-link {
            display: block;
            width: 100%;
            text-align: center;
            background: linear-gradient(135deg, #d4af37 0%, #f59e0b 100%);
            color: #0b0f19;
            font-weight: 700;
            padding: 0.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🗺️ JAPANESE SAKE BREWERY MAP</h1>
        <div class="header-nav">
            <a href="/" class="nav-btn">🍶 日本酒Viewerへ戻る</a>
            <a href="/admin.html" class="nav-btn">⚙️ 管理画面</a>
        </div>
    </header>

    <div id="map-container">
        <div class="region-filter-bar">
            <button class="region-btn active" onclick="filterRegion('all', this)">🌐 全国全蔵 (1,604)</button>
            <button class="region-btn" onclick="filterRegion('北海道・東北', this)">雪国の名酒 (北海道・東北)</button>
            <button class="region-btn" onclick="filterRegion('関東', this)">関東エリア</button>
            <button class="region-btn" onclick="filterRegion('甲信越', this)">酒処 (新潟・長野・山梨)</button>
            <button class="region-btn" onclick="filterRegion('東海', this)">東海エリア</button>
            <button class="region-btn" onclick="filterRegion('関西', "this")">灘・伏見 (関西)</button>
            <button class="region-btn" onclick="filterRegion('中国・四国', this)">西日本 (中国・四国)</button>
            <button class="region-btn" onclick="filterRegion('九州・沖縄', this)">焼酎・泡盛 (九州・沖縄)</button>
        </div>
        <div id="map"></div>
    </div>

    <script>
        let map;
        let allBreweries = [];
        let markersGroup;

        const REGION_PREFS = {
            '北海道・東北': ['北海道', '青森県', '岩手県', '宮城県', '秋田県', '山形県', '福島県'],
            '関東': ['茨城県', '栃木県', '群馬県', '埼玉県', '千葉県', '東京都', '神奈川県'],
            '甲信越': ['新潟県', '長野県', '山梨県'],
            '東海': ['岐阜県', '静岡県', '愛知県', '三重県'],
            '関西': ['滋賀県', '京都府', '大阪府', '兵庫県', '奈良県', '和歌山県'],
            '中国・四国': ['鳥取県', '島根県', '岡山県', '広島県', '山口県', '徳島県', '香川県', '愛媛県', '高知県'],
            '九州・沖縄': ['福岡県', '佐賀県', '長崎県', '熊本県', '大分県', '宮崎県', '鹿児島県', '沖縄県']
        };

        function initMap() {
            // Initialize Leaflet map centered at Japan
            map = L.map('map', {
                center: [36.5, 137.5],
                zoom: 6,
                zoomControl: false,
                preferCanvas: true
            });

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Dark Mode Tile Layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            markersGroup = L.layerGroup().addTo(map);

            loadBreweriesData();
        }

        async function loadBreweriesData() {
            try {
                const response = await fetch('/api/breweries/map');
                if (!response.ok) return;
                allBreweries = await response.json();
                renderMarkers(allBreweries);
            } catch (err) {
                console.error("Map data fetch error:", err);
            }
        }

        function renderMarkers(breweries) {
            markersGroup.clearLayers();

            breweries.forEach(b => {
                if (!b.latitude || !b.longitude) return;

                const marker = L.circleMarker([b.latitude, b.longitude], {
                    radius: 6,
                    fillColor: '#d4af37',
                    color: '#fff',
                    weight: 1,
                    opacity: 0.9,
                    fillOpacity: 0.8
                });

                const popupHtml = `
                    <div class="popup-card">
                        <div class="popup-title">${b.name}</div>
                        <div class="popup-pref">📍 ${b.prefecture || ''} ${b.city || ''} ${b.founding_year ? '| 創業: ' + b.founding_year : ''}</div>
                        ${b.rep_image ? `<img class="popup-img" src="${b.rep_image}">` : ''}
                        <div class="popup-info">
                            ${b.rep_brand ? `🍶 代表銘柄: <strong>${b.rep_brand}</strong><br>` : ''}
                            ${b.address ? `🏢 ${b.address}` : ''}
                        </div>
                        <a href="/?search=${encodeURIComponent(b.name)}" class="popup-link">🍶 この酒蔵の銘柄を見る</a>
                    </div>
                `;

                marker.bindPopup(popupHtml);
                markersGroup.addLayer(marker);
            });
        }

        function filterRegion(regionKey, btn) {
            document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            if (regionKey === 'all') {
                renderMarkers(allBreweries);
                map.flyTo([36.5, 137.5], 6);
            } else {
                const prefs = REGION_PREFS[regionKey] || [];
                const filtered = allBreweries.filter(b => prefs.includes(b.prefecture));
                renderMarkers(filtered);
                
                if (filtered.length > 0) {
                    const avgLat = filtered.reduce((acc, curr) => acc + curr.latitude, 0) / filtered.length;
                    const avgLng = filtered.reduce((acc, curr) => acc + curr.longitude, 0) / filtered.length;
                    map.flyTo([avgLat, avgLng], 7);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>
